name: Keep Supabase awake

# Supabase's free tier pauses a project after a week of no activity.
# This just runs a trivial read every few days so that never happens.

on:
  schedule:
    - cron: "0 6 */5 * *"   # every 5 days at 06:00 UTC
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install psycopg2-binary
          python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = conn.cursor()
          cur.execute('SELECT 1')
          print('Pinged Supabase:', cur.fetchone())
          conn.close()
          "
