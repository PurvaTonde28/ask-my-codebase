[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repoza"
version = "0.1.0"
description = "Multi-agent RAG + SQL assistant for exploring a codebase and its commit history."
requires-python = ">=3.11"
# Dependencies are managed in requirements.txt, not duplicated here --
# this file exists to make the project importable/installable
# (pip install -e .), not to replace requirements.txt.

[tool.setuptools.packages.find]
include = ["agents*", "ingestion*", "splitters*", "vectorstore*"]